name: rustinel
description: Defensive supply-chain risk diff for Rust projects — posts a sticky PR comment.
branding:
  icon: shield
  color: orange

inputs:
  command:
    description: "rustinel command to run: check or diff"
    required: false
    default: check
  lockfile:
    description: Path to Cargo.lock (check mode)
    required: false
    default: Cargo.lock
  base-lockfile:
    description: Base Cargo.lock (diff mode)
    required: false
  head-lockfile:
    description: Head Cargo.lock (diff mode)
    required: false
  policy:
    description: Path to rustinel.toml
    required: false
  offline:
    description: Run without network access
    required: false
    default: "false"
  online-metadata:
    description: Query crates.io for yanked versions, publish dates, owners and download counts (powers freshness / ownership-change / typosquat signals)
    required: false
    default: "false"
  fail-on-review-required:
    description: Treat review_required decisions as a failure
    required: false
    default: "false"
  comment:
    description: Post/update a sticky comment on the pull request
    required: false
    default: "true"
  code-scanning:
    description: "Upload findings to GitHub code scanning (Security tab) as a SARIF report. Requires the workflow to grant `security-events: write`."
    required: false
    default: "false"
  github-token:
    description: Token used to post the PR comment (needs pull-requests:write)
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: Path to the generated Markdown report
    value: rustinel-report.md
  sarif-path:
    description: Path to the generated SARIF report (when code-scanning is enabled)
    value: rustinel.sarif

runs:
  using: composite
  steps:
    - name: Install rustinel
      shell: bash
      run: |
        set -e
        if command -v cargo-rustinel >/dev/null 2>&1; then exit 0; fi
        # 1. Published crate — fast once cargo-rustinel is on crates.io.
        if cargo install cargo-rustinel --locked; then exit 0; fi
        # 2. Build from this repository at the exact ref the action was invoked
        #    with (e.g. `@v1`), so an external consumer is fully self-contained —
        #    no crates.io and no `crates/rustinel-cli` in *their* checkout needed.
        REF="${{ github.action_ref }}"
        cargo install --git https://github.com/kosiorkosa47/rustinel \
          ${REF:+--rev "$REF"} cargo-rustinel --locked

    - name: Run rustinel
      id: run
      shell: bash
      run: |
        set +e
        # Fail fast with a clear message instead of letting clap exit 2 on empty
        # paths (which would post an empty PR comment and look like a policy fail).
        if [ "${{ inputs.command }}" = "diff" ] \
           && { [ -z "${{ inputs.base-lockfile }}" ] || [ -z "${{ inputs.head-lockfile }}" ]; }; then
          echo "::error::rustinel: 'diff' requires both 'base-lockfile' and 'head-lockfile' inputs."
          exit 1
        fi
        ARGS=(rustinel "${{ inputs.command }}")
        if [ "${{ inputs.command }}" = "diff" ]; then
          ARGS+=(--base-lockfile "${{ inputs.base-lockfile }}" --head-lockfile "${{ inputs.head-lockfile }}")
        else
          ARGS+=(--lockfile "${{ inputs.lockfile }}")
        fi
        ARGS+=(--format markdown --output rustinel-report.md --no-timestamp)
        [ -n "${{ inputs.policy }}" ] && ARGS+=(--policy "${{ inputs.policy }}")
        [ "${{ inputs.offline }}" = "true" ] && ARGS+=(--offline)
        [ "${{ inputs.online-metadata }}" = "true" ] && ARGS+=(--online-metadata)
        [ "${{ inputs.fail-on-review-required }}" = "true" ] && ARGS+=(--fail-on-review-required)
        cargo "${ARGS[@]}"
        echo "exit=$?" >> "$GITHUB_OUTPUT"

    - name: Post sticky PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        MARKER="<!-- rustinel-report -->"
        BODY="$(printf '%s\n%s\n' "$MARKER" "$(cat rustinel-report.md)")"
        PR="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        EXISTING="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")"
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
          echo "Updated existing rustinel comment ($EXISTING)."
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          echo "Posted new rustinel comment."
        fi

    - name: Generate SARIF for code scanning
      if: ${{ inputs.code-scanning == 'true' }}
      shell: bash
      run: |
        # Code-scanning alerts represent the *current* risk of the lockfile, so
        # always emit a `check` SARIF (full findings) even in diff mode. Never
        # fail the build on SARIF generation — it is a reporting side-channel.
        LF="${{ inputs.lockfile }}"
        [ "${{ inputs.command }}" = "diff" ] && LF="${{ inputs.head-lockfile }}"
        ARGS=(rustinel check --lockfile "$LF" --format sarif --output rustinel.sarif --no-timestamp)
        [ -n "${{ inputs.policy }}" ] && ARGS+=(--policy "${{ inputs.policy }}")
        [ "${{ inputs.offline }}" = "true" ] && ARGS+=(--offline)
        [ "${{ inputs.online-metadata }}" = "true" ] && ARGS+=(--online-metadata)
        cargo "${ARGS[@]}" || true

    - name: Upload SARIF to code scanning
      if: ${{ inputs.code-scanning == 'true' && hashFiles('rustinel.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: rustinel.sarif
        category: rustinel

    - name: Enforce policy decision
      shell: bash
      run: |
        # Surface the report in the job log and fail the check if rustinel did.
        cat rustinel-report.md || true
        exit "${{ steps.run.outputs.exit }}"
