name: Release

# Build prebuilt `cargo-rustinel` binaries for `cargo binstall` and attach them
# to the GitHub Release when a `v*` tag is pushed. Asset names match the
# `[package.metadata.binstall]` pkg-url in crates/rustinel-cli/Cargo.toml:
#   cargo-rustinel-<target>.tar.gz
on:
  push:
    # Full semver tags only (v1.2.3) — NOT the floating major alias (v0 / v1),
    # which is moved on every release and must not spawn its own release build.
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  # Create the GitHub Release once, before the matrix runs, so the parallel
  # build jobs only ever *upload* to it (no concurrent create-release race).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Prebuilt binaries for \`cargo binstall cargo-rustinel\`." \
            --verify-tag || echo "release already exists; continuing"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p cargo-rustinel --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          NAME="cargo-rustinel-${{ matrix.target }}"
          BIN="cargo-rustinel"
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN="cargo-rustinel.exe"
          tar -C "target/${{ matrix.target }}/release" -czf "${NAME}.tar.gz" "$BIN"
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" "cargo-rustinel-${{ matrix.target }}.tar.gz" --clobber
