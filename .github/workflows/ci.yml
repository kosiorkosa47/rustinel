name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint once (fast) on Linux/stable.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Test across the three major platforms (the analysis touches paths, symlinks
  # and the filesystem, which behave differently per-OS).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  # Guarantee the declared MSRV (rust-version in Cargo.toml) keeps building.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Build (MSRV)
        run: cargo build --workspace

  # Advisory-matching parity: prove rustinel reports the same advisory set as
  # cargo-audit (the RustSec reference implementation) on the project lockfile
  # AND an edge-case corpus (prerelease ordering, multi-range patched bounds,
  # withdrawn suppression, crates.io-only source scoping). It asserts agreement,
  # not a fixed count, so it stays valid as the advisory database evolves.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Fetch advisory database
        run: cargo audit >/dev/null 2>&1 || true
      - name: Advisory parity vs cargo-audit
        run: |
          scripts/audit-diff.sh Cargo.lock
          scripts/audit-diff.sh fixtures/parity/Cargo.lock

  # Dogfood: rustinel reviews its own supply chain, posts a sticky PR comment,
  # and uploads the report. Informational — never fails the build on its own risk.
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write # upload our own SARIF to code scanning (dogfood)
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cargo-rustinel
      - name: Sync the RustSec advisory database
        run: ./target/release/cargo-rustinel rustinel advisory update || true
      - name: Scan own lockfile
        run: |
          ./target/release/cargo-rustinel rustinel check \
            --lockfile Cargo.lock \
            --format markdown \
            --output rustinel-report.md --no-timestamp || true
      - name: Generate SARIF
        run: |
          ./target/release/cargo-rustinel rustinel check \
            --lockfile Cargo.lock \
            --format sarif \
            --output rustinel.sarif --no-timestamp || true
      - name: Upload SARIF to code scanning
        if: hashFiles('rustinel.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rustinel.sarif
          category: rustinel
      - name: Post sticky PR comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- rustinel-report -->"
          BODY="$(printf '%s\n%s\n' "$MARKER" "$(cat rustinel-report.md)")"
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          EXISTING="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")"
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rustinel-report
          path: rustinel-report.md
