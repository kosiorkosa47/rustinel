name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint once (fast) on Linux/stable.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Test across the three major platforms (the analysis touches paths, symlinks
  # and the filesystem, which behave differently per-OS).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  # Guarantee the declared MSRV (rust-version in Cargo.toml) keeps building.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Build (MSRV)
        run: cargo build --workspace

  # Dogfood: rustinel analyzes its own lockfile and posts/uploads the report.
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cargo-rustinel
      - name: Scan own lockfile
        run: |
          ./target/release/cargo-rustinel rustinel check \
            --lockfile Cargo.lock \
            --format markdown \
            --output rustinel-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustinel-report
          path: rustinel-report.md
